version: 2

sources:
  - name: mailchimp
    database: TIL_DATA_ENGINEERING
    schema: CYI_Staging
    tables:
      - name: mailchimp_raw_python_members
        description: "dim table of member records from mailchimp"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
      - name: mailchimp_raw_python_clicks
        description: "fact table of member clicks on links sent during campaigns"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
      - name: mailchimp_raw_python_email_activity
        description: "fact table of email activity on links sent during campaigns"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour

      - name: mailchimp_raw_python_campaigns
        description: "dimension table of campaigns"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
