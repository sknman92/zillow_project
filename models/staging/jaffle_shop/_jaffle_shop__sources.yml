version: 2

sources:
  - name: jaffle_shop
    database: raw
    tables:
      - name: customers
        columns:
          - name: id
            data_type: number
            description: "{{doc('customer_id')}}"
            data_tests:
              - unique
              - not_null

          - name: first_name
            data_type: varchar
            description: "{{doc('first_name')}}"
            data_tests:
              - not_null:
                  config:
                    severity: warn
                            
          - name: last_name
            data_type: varchar
            description: "{{doc('last_name')}}"
            data_tests:
              - not_null  

      - name: items
        columns:
          - name: id
            data_type: varchar
          - name: order_id
            data_type: varchar
          - name: sku
            data_type: varchar

      - name: orders
        columns:
          - name: id
            data_type: number
            description: "{{doc('order_id')}}"
            data_tests:
              - unique
              - not_null

          - name: user_id
            data_type: number
            description: "{{doc('customer_id')}}"
            data_tests:
              - not_null  
              - relationships:
                  arguments:
                    field: id
                    to: source('jaffle_shop', 'customers')

          - name: order_date
            data_type: date
          - name: status
            data_type: varchar
            description: "{{doc('order_status')}}"

          - name: _etl_loaded_at
            data_type: timestamp_ntz

      - name: products
        columns:  
          - name: sku
            data_type: varchar
          - name: name
            data_type: varchar
          - name: type
            data_type: varchar
          - name: price
            data_type: number
          - name: description
            data_type: varchar

      - name: stores
        columns:
          - name: id
            data_type: varchar
          - name: name
            data_type: varchar
          - name: opened_at
            data_type: timestamp_ntz
          - name: tax_rate
            data_type: number

      - name: supplies
        columns:
          - name: id
            data_type: varchar
          - name: name
            data_type: varchar
          - name: cost
            data_type: number
          - name: perishable
            data_type: boolean
          - name: sku
            data_type: varchar
