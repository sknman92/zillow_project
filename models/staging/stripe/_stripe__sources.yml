version: 2

sources:
  - name: stripe
    database: raw
    tables:
      - name: payment
        columns:
          - name: id
            description: "{{doc('payment_id')}}"
            data_type: number
            data_tests:
              - unique
              - not_null

          - name: orderid
            data_type: number
            description: "{{doc('order_id')}}"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('jaffle_shop', 'orders')
              

          - name: paymentmethod
            data_type: varchar
            description: "{{doc('payment_method')}}"
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['credit_card', 
                            'coupon',
                            'bank_transfer',
                            'gift_card']

          - name: status
            data_type: varchar
            description: "The status of the pyamnet sent with stripe"
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['success', 
                            'fail']

          - name: amount
            data_type: number
            data_tests:
              - no_negative_values

          - name: created
            data_type: date
          - name: _batched_at
            data_type: timestamp_ntz
