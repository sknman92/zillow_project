version: 2

models:
  - name: stg_stripe__payments
    description: "Staging version of raw stripe payment table"
    columns:
      - name: payment_id
        description: "{{doc('payment_id')}}"

      - name: order_id
        description: "{{doc('order_id')}}"

      - name: method
        description: "{{doc('payment_method')}}"

      - name: status
        description: "{{doc('payment_status')}}"

      - name: amount
        description: "{{doc('amount')}}"

      - name: payment_date
        description: ""

  - name: stg_stripe__successful_payments
    description: "Filtered versin ofo staged table, just showing successful payments"
    columns:
      - name: payment_id
        description: "{{doc('payment_id')}}"

      - name: order_id
        description: "{{doc('order_id')}}"

      - name: method
        description: "{{doc('payment_method')}}"

      - name: status
        description: "{{doc('payment_status')}}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['success'] 

      - name: amount
        description: "{{doc('amount')}}"
        data_tests:
          - no_negative_values

      - name: payment_date
        description: ""
