version: 2

models:
  - name: stg_mailchimp_unsubscribes
    description: staging unsubscribes table to rename all columns without double quotes
    columns:
      - name: _airbyte_raw_id
        data_type: varchar
        description: unique id generated by airbyte
        data_tests:
          - unique
          - not_null

      - name: _airbyte_extracted_at
        data_type: timestamp_ntz
        description: when the data was ingested. Generated by airbyte
        data_tests:
          - not_null

      - name: _airbyte_generation_id
        data_type: number
        description: id generated by airbyte of the generation
        data_tests:
          - not_null

      - name: _airbyte_meta
        data_type: variant
        description: meta information about the row, if there are changes from airbyte

      - name: vip
        data_type: boolean
        description: flag to show vip customers
        data_tests:
          - not_null

      - name: reason
        data_type: varchar
        description: reason given for the unsubscription

      - name: list_id
        data_type: varchar
        description: foreign key from the lists table
        data_tests:
          - relationships:
            to: source('mailchimp','lists')
            field: "list_id"

      - name: email_id
        data_type: varchar
        description: user's email id

      - name: timestamp
        data_type: timestamp_ntz
        description: when the user unsubscribed

      - name: campaign_id
        data_type: varchar
        description: foreign key from campaigns table
        data_tests:
          - relationships:
            to: source('mailchimp','campaigns')
            field: "campaign_id"

      - name: merge_fields
        data_type: varchar
        description: json holding the users names and company
        data_tests:
          - not_null

      - name: email_address
        data_type: varchar
        description: user's email address

      - name: list_is_active
        data_type: boolean
        description: flag to show if list is currently active
        data_tests:
          - not_null
