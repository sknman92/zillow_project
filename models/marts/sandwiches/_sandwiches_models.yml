version: 2

models:
  - name: sandwiches_customers
    description: "Enriched customer level information for our Jaffle shop"
    columns:
      - name: customer_id
        description: "{{doc('customer_id')}}"

      - name: full_name
        description: ""

      - name: surname
        description: "{{doc('last_name')}}"

      - name: givenname
        description: "{{doc('first_name')}}"

      - name: first_order_date
        description: ""

      - name: first_non_returned_order_date
        description: ""

      - name: most_recent_non_returned_order_date
        description: ""

      - name: order_count
        description: "total orders for this customer over all time"
        data_tests:
          - no_negative_values

      - name: non_returned_order_count
        description: ""
        data_tests:
          - no_negative_values

      - name: total_lifetime_value
        description: "total dollar amount spent by this customer over all time"
        data_tests:
          - no_negative_values

      - name: avg_non_returned_order_value
        description: ""
        data_tests:
          - no_negative_values

      - name: order_ids
        description: ""

  - name: sandwiches_orders
    tests:
      - dbt_utils.equality:
          arguments:
            compare_model: ref('tmp_orders_with_detail_to_refactor')
    description: ""
    columns:
      - name: order_id
        description: "{{doc('order_id')}}"

      - name: customer_id
        description: "{{doc('customer_id')}}"

      - name: surname
        description: "{{doc('last_name')}}"

      - name: givenname
        description: "{{doc('first_name')}}"

      - name: first_order_date
        description: ""

      - name: order_count
        description: ""
        data_tests:
          - no_negative_values

      - name: total_lifetime_value
        description: ""
        data_tests:
          - no_negative_values

      - name: order_value_dollars
        description: ""
        data_tests:
          - no_negative_values

      - name: order_status
        description: "{{doc('order_status')}}"

      - name: payment_status
        description: "{{doc('payment_status')}}"

    config:
      post-hook:
        - "{{ 'DROP view '~ target.database ~'.'~ target.schema ~'_temporary.tmp_orders_with_detail_to_refactor'}} "

          
