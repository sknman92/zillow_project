snapshots:
  - name: snapshot_mailchimp_members
    relation: source('mailchimp', 'mailchimp_raw_python_members')
    description:  "snapshot for mailchimp members dim table"
    config:
      strategy: timestamp
      unique_key: member_id
      updated_at: last_changed
  
  - name: snapshot_mailchimp_campaigns
    relation: source('mailchimp', 'mailchimp_raw_python_campaigns')
    description: "snapshot for mailchimp campaigns dim table"
    config:
      strategy: check
      unique_key: campaign_id
      check_cols: ['last_open', 'last_click']
